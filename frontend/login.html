<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | CarePulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-slate-900 flex items-center justify-center px-4 py-10">
    <main class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8">
      <a href="./index.html" class="block text-center text-slate-900 text-2xl font-bold mb-8">CarePulse</a>
      <h1 class="text-3xl font-bold text-slate-900">Welcome back</h1>
      <p class="mt-2 text-slate-600">Sign in to continue to CarePulse.</p>
      <form id="login-form" class="mt-8 space-y-5" novalidate>
        <div>
          <label for="login-email" class="block text-slate-900 font-semibold mb-2">Email address</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500" aria-describedby="login-email-error" />
          <p id="login-email-error" class="mt-1 text-sm text-red-600" hidden></p>
        </div>
        <div>
          <label for="login-password" class="block text-slate-900 font-semibold mb-2">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="8" class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500" aria-describedby="login-password-error" />
          <p id="login-password-error" class="mt-1 text-sm text-red-600" hidden></p>
        </div>
        <p id="login-status" class="min-h-6 text-sm text-slate-600" role="status" aria-live="polite"></p>
        <button id="login-submit" type="submit" class="w-full rounded-lg bg-slate-900 text-white px-4 py-3 font-semibold hover:opacity-90 disabled:opacity-60">Sign in</button>
      </form>
      <p class="mt-6 text-center text-slate-600">New to CarePulse? <a href="./register.html" class="text-pink-600 font-bold hover:underline">Create an account</a></p>
    </main>
    <script type="module" src="./js/pages/login-page.js"></script>
  </body>
</html>
