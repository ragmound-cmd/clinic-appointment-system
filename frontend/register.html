<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account | CarePulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-50 text-slate-900 flex items-center justify-center px-4 py-10">
    <main class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm p-6 sm:p-8">
      <a href="./index.html" class="block text-center text-slate-900 text-2xl font-bold mb-8">CarePulse</a>
      <h1 class="text-3xl font-bold text-slate-900">Create your account</h1>
      <p class="mt-2 text-slate-600">Join CarePulse to manage your care journey.</p>
      <form id="register-form" class="mt-8 space-y-5" novalidate>
        <div><label for="register-name" class="block text-slate-900 font-semibold mb-2">Full name</label><input id="register-name" name="name" type="text" autocomplete="name" required class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500" aria-describedby="register-name-error" /><p id="register-name-error" class="mt-1 text-sm text-red-600" hidden></p></div>
        <div><label for="register-email" class="block text-slate-900 font-semibold mb-2">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500" aria-describedby="register-email-error" /><p id="register-email-error" class="mt-1 text-sm text-red-600" hidden></p></div>
        <div><label for="register-password" class="block text-slate-900 font-semibold mb-2">Password</label><input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500" aria-describedby="register-password-error" /><p id="register-password-error" class="mt-1 text-sm text-red-600" hidden></p></div>
        <div><label for="register-password-confirmation" class="block text-slate-900 font-semibold mb-2">Confirm password</label><input id="register-password-confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500" aria-describedby="register-password-confirmation-error" /><p id="register-password-confirmation-error" class="mt-1 text-sm text-red-600" hidden></p></div>
        <p id="register-status" class="min-h-6 text-sm text-slate-600" role="status" aria-live="polite"></p>
        <button id="register-submit" type="submit" class="w-full rounded-lg bg-slate-900 text-white px-4 py-3 font-semibold hover:opacity-90 disabled:opacity-60">Create account</button>
      </form>
      <p class="mt-6 text-center text-slate-600">Already have an account? <a href="./login.html" class="text-pink-600 font-bold hover:underline">Sign in</a></p>
    </main>
    <script type="module" src="./js/pages/register-page.js"></script>
  </body>
</html>
